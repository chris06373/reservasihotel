<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CJ Tech — Halaman Logika Reservasi Hotel</title>
  <style>
    :root {
      --bg-cream: #fdf6f2;
      --surface: #ffffff;
      --brown-dark: #3b1c14;
      --brown-mid: #633224;
      --red-primary: #a61c1c;
      --red-hover: #821212;
      --red-soft: #fdecec;
      --border: #e6cfc7;
      --text-main: #2a140e;
      --text-muted: #6e5046;
      --paid-bg: #e7f6ec;
      --paid-text: #186332;
      --pending-bg: #fff4e0;
      --pending-text: #8f5400;
      --unpaid-bg: #fde8e8;
      --unpaid-text: #9b1c1c;
      --radius: 12px;
      --shadow: 0 6px 20px rgba(59, 28, 20, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, var(--brown-dark) 0%, var(--red-primary) 100%);
      color: #fff;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1160px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-title { font-size: 1.12rem; font-weight: 700; }
    .brand-sub { font-size: 0.78rem; color: #f7d9d2; }

    .view-link {
      text-decoration: none;
      background: #fff;
      color: var(--red-primary);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 9px 15px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
    }

    main {
      max-width: 1160px;
      margin: 20px auto 44px;
      padding: 0 14px;
      display: grid;
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .card-title { font-size: 1.05rem; font-weight: 700; color: var(--brown-dark); }

    .crud-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 0.82rem; font-weight: 600; color: var(--brown-mid); }

    input, select {
      padding: 9px 11px;
      border: 1px solid #d5b4a9;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-main);
      background: #fffdfb;
      min-height: 40px;
    }

    .form-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 38px;
    }

    .btn-primary { background: var(--red-primary); color: #fff; }
    .btn-primary:hover { background: var(--red-hover); }
    .btn-secondary { background: #efe2dc; color: var(--brown-dark); }
    .btn-brown { background: var(--brown-mid); color: #fff; }
    .btn-outline-red { background: #fff; color: var(--red-primary); border: 1px solid var(--red-primary); }
    .btn-sm { padding: 6px 10px; font-size: 0.78rem; min-height: 34px; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .toolbar input, .toolbar select { flex: 1 1 170px; }

    .export-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding: 10px 12px;
      background: #fdf4f1;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .export-group { display: flex; flex-wrap: wrap; gap: 8px; }

    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 780px; }
    th { background: var(--brown-dark); color: #fff; text-align: left; padding: 10px 12px; font-size: 0.82rem; }
    td { padding: 10px 12px; border-bottom: 1px solid #f0ded8; font-size: 0.86rem; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .badge-Lunas { background: var(--paid-bg); color: var(--paid-text); }
    .badge-DP { background: var(--pending-bg); color: var(--pending-text); }
    .badge-Belum { background: var(--unpaid-bg); color: var(--unpaid-text); }

    .pagination-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .pagination-pages { display: flex; flex-wrap: wrap; gap: 6px; }
    .page-btn {
      min-width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid #d5b4a9;
      background: #fff;
      color: var(--brown-dark);
      font-weight: 600;
      cursor: pointer;
    }
    .page-btn.active { background: var(--red-primary); border-color: var(--red-primary); color: #fff; }

    .hidden { display: none !important; }

    @media print {
      body * { visibility: hidden; }
      body.printing-report .print-area, body.printing-report .print-area * { visibility: visible; }
      body.printing-report .print-area { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <svg width="42" height="42" viewBox="0 0 48 48" fill="none" aria-label="Logo CJ Tech">
          <rect width="48" height="48" rx="11" fill="#2A110B" stroke="#F3B4A6" stroke-width="1.5"/>
          <path d="M21 15C16.58 15 13 18.58 13 23C13 27.42 16.58 31 21 31C23.1 31 25.02 30.19 26.46 28.86" stroke="#FF6B57" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M31 15V26.5C31 29.26 28.76 31.5 26 31.5H24.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="35" cy="14" r="3" fill="#FF9E44"/>
        </svg>
        <div>
          <div class="brand-title">Grand Nusantara Hotel</div>
          <div class="brand-sub">Halaman Logika • <strong>CJ Tech</strong></div>
        </div>
      </div>

      <a href="tampilan.html" class="view-link">← Kembali ke Tampilan</a>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="card-header">
        <h2 class="card-title" id="formHeading">Tambah Reservasi Baru (Create)</h2>
        <button type="button" class="btn btn-secondary btn-sm" id="loadSampleBtn">Muat Data Contoh</button>
      </div>

      <form class="crud-form" id="reservationForm">
        <input type="hidden" id="editId" />
        <div class="field">
          <label for="guestName">Nama Tamu</label>
          <input type="text" id="guestName" placeholder="Masukkan nama tamu" required />
        </div>
        <div class="field">
          <label for="roomType">Tipe & Nomor Kamar</label>
          <select id="roomType" required>
            <option value="Deluxe King — 201">Deluxe King — 201 (Rp750.000/mlm)</option>
            <option value="Superior Twin — 105">Superior Twin — 105 (Rp550.000/mlm)</option>
            <option value="Executive Suite — 402">Executive Suite — 402 (Rp1.350.000/mlm)</option>
            <option value="Family Room — 308">Family Room — 308 (Rp980.000/mlm)</option>
          </select>
        </div>
        <div class="field">
          <label for="checkIn">Tanggal Check-In</label>
          <input type="date" id="checkIn" required />
        </div>
        <div class="field">
          <label for="checkOut">Tanggal Check-Out</label>
          <input type="date" id="checkOut" required />
        </div>
        <div class="field">
          <label for="paymentStatus">Status Pembayaran</label>
          <select id="paymentStatus" required>
            <option value="Lunas">Lunas</option>
            <option value="DP">DP</option>
            <option value="Belum Bayar">Belum Bayar</option>
          </select>
        </div>
        <div class="field">
          <label for="stayStatus">Status Histori</label>
          <select id="stayStatus" required>
            <option value="Aktif Menginap">Aktif Menginap</option>
            <option value="Akan Datang">Akan Datang</option>
            <option value="Selesai (Check-Out)">Selesai (Check-Out)</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Simpan Reservasi</button>
          <button type="button" class="btn btn-secondary hidden" id="cancelEditBtn">Batal Edit</button>
        </div>
      </form>
    </section>

    <section class="card print-area">
      <div class="card-header">
        <h2 class="card-title">Proses Data, Filter & Ekspor</h2>
      </div>

      <div class="export-bar">
        <div class="export-group">
          <button type="button" class="btn btn-brown btn-sm" id="exportExcelBtn">Download Excel (.xls)</button>
          <button type="button" class="btn btn-primary btn-sm" id="exportPdfBtn">Download PDF Histori</button>
        </div>
        <button type="button" class="btn btn-outline-red btn-sm" id="clearStorageBtn">Hapus Penyimpanan</button>
      </div>

      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Cari ID, nama tamu, atau kamar..." />
        <select id="filterPayment">
          <option value="ALL">Semua Pembayaran</option>
          <option value="Lunas">Lunas</option>
          <option value="DP">DP</option>
          <option value="Belum Bayar">Belum Bayar</option>
        </select>
        <select id="filterStay">
          <option value="ALL">Semua Histori</option>
          <option value="Aktif Menginap">Aktif Menginap</option>
          <option value="Akan Datang">Akan Datang</option>
          <option value="Selesai (Check-Out)">Selesai (Check-Out)</option>
        </select>
        <select id="pageSizeSelect" aria-label="Jumlah baris">
          <option value="5">5 / hal</option>
          <option value="10">10 / hal</option>
          <option value="20">20 / hal</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nama Tamu</th>
              <th>Kamar</th>
              <th>Periode</th>
              <th>Durasi & Total</th>
              <th>Pembayaran</th>
              <th>Histori</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="logicTableBody"></tbody>
        </table>
      </div>

      <div class="pagination-bar">
        <div id="paginationInfo" style="font-size:0.82rem; color:var(--text-muted);">Menampilkan 0 data</div>
        <div class="pagination-pages" id="paginationPages"></div>
      </div>
    </section>
  </main>

  <script>
    const DATA_KEY = "cjtech_hotel_reservations_v4";
    const VIEW_KEY = "cjtech_hotel_view_snapshot_v4";
    const CHANNEL = "BroadcastChannel" in window ? new BroadcastChannel("cjtech_hotel_v4_channel") : null;

    const ROOMS = [
      { name: "Deluxe King — 201", spec: "King Bed • AC • Sarapan", rate: 750000 },
      { name: "Superior Twin — 105", spec: "Twin Bed • Wi-Fi • Balkon", rate: 550000 },
      { name: "Executive Suite — 402", spec: "Living Area • City View", rate: 1350000 },
      { name: "Family Room — 308", spec: "2 Bed • Kapasitas 4 Tamu", rate: 980000 }
    ];

    const ROOM_RATES = Object.fromEntries(ROOMS.map((r) => [r.name, r.rate]));
    const rupiah = (n) =>
      new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n);

    const HotelLogicWorker = {
      read() {
        try {
          const arr = JSON.parse(localStorage.getItem(DATA_KEY) || "[]");
          return Array.isArray(arr) ? arr : [];
        } catch {
          return [];
        }
      },

      write(list) {
        localStorage.setItem(DATA_KEY, JSON.stringify(list));
        this.publishViewSnapshot(list);
      },

      clear() {
        localStorage.removeItem(DATA_KEY);
        this.publishViewSnapshot([]);
      },

      calcNights(checkIn, checkOut) {
        const diff = Math.round((new Date(checkOut + "T00:00:00") - new Date(checkIn + "T00:00:00")) / 86400000);
        return diff > 0 ? diff : 1;
      },

      calcTotal(roomType, checkIn, checkOut) {
        const rate = ROOM_RATES[roomType] || 650000;
        const nights = this.calcNights(checkIn, checkOut);
        return { rate, nights, total: rate * nights };
      },

      hasConflict(payload, ignoreId = "") {
        if (payload.stayStatus === "Selesai (Check-Out)") return false;
        const a1 = new Date(payload.checkIn + "T00:00:00");
        const a2 = new Date(payload.checkOut + "T00:00:00");
        return this.read().some((item) => {
          if (ignoreId && item.id === ignoreId) return false;
          if (item.roomType !== payload.roomType) return false;
          if (item.stayStatus === "Selesai (Check-Out)") return false;
          const b1 = new Date(item.checkIn + "T00:00:00");
          const b2 = new Date(item.checkOut + "T00:00:00");
          return a1 < b2 && a2 > b1;
        });
      },

      save(payload, editId = "") {
        if (!payload.guestName) return { ok: false, msg: "Nama tamu wajib diisi." };
        if (payload.checkOut <= payload.checkIn) return { ok: false, msg: "Tanggal Check-Out harus setelah Check-In." };
        if (this.hasConflict(payload, editId)) return { ok: false, msg: "Kamar bentrok pada rentang tanggal tersebut." };

        const list = this.read();
        if (editId) {
          this.write(list.map((r) => (r.id === editId ? { ...r, ...payload } : r)));
          return { ok: true, mode: "update" };
        }
        const record = { id: `RSV-${String(Date.now()).slice(-4)}`, ...payload };
        list.unshift(record);
        this.write(list);
        return { ok: true, mode: "create" };
      },

      // Membuat paket tampilan siap render untuk tampilan.html
      publishViewSnapshot(list) {
        const totalNights = list.reduce((s, r) => s + this.calcNights(r.checkIn, r.checkOut), 0);
        const snapshot = {
          stats: {
            total: list.length,
            nightsLabel: `${totalNights} Malam`,
            paid: list.filter((r) => r.paymentStatus === "Lunas").length
          },
          rooms: ROOMS.map((r) => ({ ...r, rateFormatted: rupiah(r.rate) })),
          items: list.map((it) => {
            const { rate, nights, total } = this.calcTotal(it.roomType, it.checkIn, it.checkOut);
            return {
              id: it.id,
              invoiceNumber: `INV-${it.id}`,
              guestName: it.guestName,
              roomType: it.roomType,
              period: `${it.checkIn} → ${it.checkOut}`,
              nightsLabel: `${nights} Malam`,
              rateFormatted: rupiah(rate),
              totalFormatted: rupiah(total),
              paymentStatus: it.paymentStatus,
              badgeKey: it.paymentStatus.split(" ")[0],
              stayStatus: it.stayStatus
            };
          })
        };
        localStorage.setItem(VIEW_KEY, JSON.stringify(snapshot));
        if (CHANNEL) CHANNEL.postMessage({ type: "SNAPSHOT_UPDATED" });
      }
    };

    let currentPage = 1;
    let pageSize = 5;

    function filteredRows() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const pay = document.getElementById("filterPayment").value;
      const stay = document.getElementById("filterStay").value;
      return HotelLogicWorker.read().filter((item) => {
        const matchQ =
          item.guestName.toLowerCase().includes(q) ||
          item.roomType.toLowerCase().includes(q) ||
          item.id.toLowerCase().includes(q);
        return matchQ && (pay === "ALL" || item.paymentStatus === pay) && (stay === "ALL" || item.stayStatus === stay);
      });
    }

    function renderLogicTable() {
      const allFiltered = filteredRows();
      const totalPages = Math.max(1, Math.ceil(allFiltered.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      const start = (currentPage - 1) * pageSize;
      const rows = allFiltered.slice(start, start + pageSize);

      const tbody = document.getElementById("logicTableBody");
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:20px; color:#6e5046;">Tidak ada data untuk ditampilkan.</td></tr>`;
        document.getElementById("paginationInfo").textContent = "Menampilkan 0 data";
        document.getElementById("paginationPages").innerHTML = "";
        return;
      }

      tbody.innerHTML = rows.map((item) => {
        const { nights, total } = HotelLogicWorker.calcTotal(item.roomType, item.checkIn, item.checkOut);
        const badgeKey = item.paymentStatus.split(" ")[0];
        return `
          <tr>
            <td><strong>${item.id}</strong></td>
            <td>${item.guestName}</td>
            <td>${item.roomType}</td>
            <td>${item.checkIn} → ${item.checkOut}</td>
            <td><strong>${nights} Malam</strong><br><small>${rupiah(total)}</small></td>
            <td><span class="badge badge-${badgeKey}">${item.paymentStatus}</span></td>
            <td>${item.stayStatus}</td>
            <td><button type="button" class="btn btn-brown btn-sm" onclick="editItem('${item.id}')">Edit</button></td>
          </tr>
        `;
      }).join("");

      document.getElementById("paginationInfo").textContent =
        `Menampilkan ${start + 1}–${Math.min(start + pageSize, allFiltered.length)} dari ${allFiltered.length} data (Hal ${currentPage}/${totalPages})`;

      let pHtml = `<button type="button" class="page-btn" ${currentPage === 1 ? "disabled" : ""} onclick="setPage(${currentPage - 1})">Prev</button>`;
      for (let p = 1; p <= totalPages; p++) {
        pHtml += `<button type="button" class="page-btn ${p === currentPage ? "active" : ""}" onclick="setPage(${p})">${p}</button>`;
      }
      pHtml += `<button type="button" class="page-btn" ${currentPage === totalPages ? "disabled" : ""} onclick="setPage(${currentPage + 1})">Next</button>`;
      document.getElementById("paginationPages").innerHTML = pHtml;
    }

    window.setPage = (p) => { currentPage = p; renderLogicTable(); };

    window.editItem = (id) => {
      const target = HotelLogicWorker.read().find((r) => r.id === id);
      if (!target) return;
      document.getElementById("editId").value = target.id;
      document.getElementById("guestName").value = target.guestName;
      document.getElementById("roomType").value = target.roomType;
      document.getElementById("checkIn").value = target.checkIn;
      document.getElementById("checkOut").value = target.checkOut;
      document.getElementById("paymentStatus").value = target.paymentStatus;
      document.getElementById("stayStatus").value = target.stayStatus;
      document.getElementById("formHeading").textContent = `Edit Reservasi ${target.id} (Update)`;
      document.getElementById("submitBtn").textContent = "Perbarui Data";
      document.getElementById("cancelEditBtn").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    function resetForm() {
      document.getElementById("editId").value = "";
      document.getElementById("reservationForm").reset();
      document.getElementById("formHeading").textContent = "Tambah Reservasi Baru (Create)";
      document.getElementById("submitBtn").textContent = "Simpan Reservasi";
      document.getElementById("cancelEditBtn").classList.add("hidden");
    }

    document.getElementById("reservationForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const editId = document.getElementById("editId").value;
      const res = HotelLogicWorker.save(
        {
          guestName: document.getElementById("guestName").value.trim(),
          roomType: document.getElementById("roomType").value,
          checkIn: document.getElementById("checkIn").value,
          checkOut: document.getElementById("checkOut").value,
          paymentStatus: document.getElementById("paymentStatus").value,
          stayStatus: document.getElementById("stayStatus").value
        },
        editId
      );
      if (!res.ok) return alert(res.msg);
      if (res.mode === "create") currentPage = 1;
      resetForm();
      renderLogicTable();
    });

    document.getElementById("cancelEditBtn").addEventListener("click", resetForm);

    document.getElementById("loadSampleBtn").addEventListener("click", () => {
      HotelLogicWorker.write([
        { id: "RSV-3001", guestName: "Rina Kusuma", roomType: "Deluxe King — 201", checkIn: "2026-11-26", checkOut: "2026-11-28", paymentStatus: "Lunas", stayStatus: "Aktif Menginap" },
        { id: "RSV-3002", guestName: "Budi Santoso", roomType: "Executive Suite — 402", checkIn: "2026-11-29", checkOut: "2026-12-01", paymentStatus: "DP", stayStatus: "Akan Datang" }
      ]);
      currentPage = 1;
      renderLogicTable();
    });

    document.getElementById("clearStorageBtn").addEventListener("click", () => {
      if (!confirm("Hapus seluruh data reservasi?")) return;
      HotelLogicWorker.clear();
      currentPage = 1;
      resetForm();
      renderLogicTable();
    });

    document.getElementById("exportPdfBtn").addEventListener("click", () => {
      if (!filteredRows().length) return alert("Tidak ada data untuk diunduh ke PDF.");
      document.body.classList.add("printing-report");
      window.print();
      setTimeout(() => document.body.classList.remove("printing-report"), 500);
    });

    document.getElementById("exportExcelBtn").addEventListener("click", () => {
      const list = filteredRows();
      if (!list.length) return alert("Tidak ada data untuk diunduh ke Excel.");
      const rows = list.map((it) => {
        const { nights, total } = HotelLogicWorker.calcTotal(it.roomType, it.checkIn, it.checkOut);
        return `<tr><td>${it.id}</td><td>${it.guestName}</td><td>${it.roomType}</td><td>${it.checkIn}</td><td>${it.checkOut}</td><td>${nights}</td><td>${total}</td><td>${it.paymentStatus}</td><td>${it.stayStatus}</td></tr>`;
      }).join("");
      const xls = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"/></head><body><table border="1"><thead><tr><th>ID</th><th>Nama Tamu</th><th>Kamar</th><th>Check-In</th><th>Check-Out</th><th>Malam</th><th>Total</th><th>Pembayaran</th><th>Histori</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
      const blob = new Blob([xls], { type: "application/vnd.ms-excel;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `histori-menginap-cjtech-${new Date().toISOString().slice(0, 10)}.xls`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    ["searchInput", "filterPayment", "filterStay"].forEach((id) => {
      document.getElementById(id).addEventListener("input", () => { currentPage = 1; renderLogicTable(); });
      document.getElementById(id).addEventListener("change", () => { currentPage = 1; renderLogicTable(); });
    });

    document.getElementById("pageSizeSelect").addEventListener("change", (e) => {
      pageSize = Number(e.target.value) || 5;
      currentPage = 1;
      renderLogicTable();
    });

    const params = new URLSearchParams(window.location.search);
    const preRoom = params.get("room");
    if (preRoom && ROOM_RATES[preRoom]) {
      document.getElementById("roomType").value = preRoom;
    }

    HotelLogicWorker.publishViewSnapshot(HotelLogicWorker.read());
    renderLogicTable();
  </script>
</body>
</html>
